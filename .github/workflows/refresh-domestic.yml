name: Refresh domestic dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "갱신 모드"
        required: true
        type: choice
        options:
          - close
          - intraday
        default: close
      force:
        description: "이미 갱신된 날짜도 다시 조회"
        required: false
        type: boolean
        default: false
  schedule:
    # Every 30 minutes from 09:00 through the 15:30 closing auction on weekdays.
    - cron: "0,30 0-5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    # 18:30 and 19:20 KST, Monday-Friday. The second run is an idempotent retry.
    - cron: "30 9 * * 1-5"
    - cron: "20 10 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
      KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
      HOSTED_DASHBOARD_URL: ${{ secrets.HOSTED_DASHBOARD_URL }}
      HOSTED_DASHBOARD_SYNC_TOKEN: ${{ secrets.HOSTED_DASHBOARD_SYNC_TOKEN }}
      HOSTED_DASHBOARD_AUTH_TOKEN: ${{ secrets.HOSTED_DASHBOARD_AUTH_TOKEN }}
      PUBLIC_DASHBOARD_URL: https://heechany.github.io/stock-market-dashboards/dashboard/
      SCAN_REQUESTS_PER_SECOND: "8"
      SCAN_CONCURRENCY: "8"
      SCAN_RETRY_ROUNDS: "6"
      SCAN_RETRY_ROUND_DELAY_MS: "500"
      PYTHON_BIN: python

    steps:
      - uses: actions/checkout@v4
      - name: Select refresh mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 9 * * 1-5" ] || [ "${{ github.event.schedule }}" = "20 10 * * 1-5" ]; then
            mode="close"
          else
            mode="intraday"
          fi
          echo "RUN_MODE=$mode" >> "$GITHUB_ENV"
          if [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ]; then
            echo "CLOSING_SNAPSHOT=1" >> "$GITHUB_ENV"
          else
            echo "CLOSING_SNAPSHOT=0" >> "$GITHUB_ENV"
          fi
          echo "Selected mode: $mode"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate automation
        run: npm test
      - name: Refresh latest completed trading day
        run: npm run refresh:dashboard
      - name: Upload generated Excel
        if: env.RUN_MODE == 'close'
        uses: actions/upload-artifact@v4
        with:
          name: domestic-flow-excel
          path: automation/output/*.xlsx
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish refreshed static data
        run: |
          if git diff --quiet -- dashboard/data.js dashboard/latest-flow.xlsx; then
            echo "No dashboard data change."
            exit 0
          fi
          git config user.name "stock-dashboard-bot"
          git config user.email "stock-dashboard-bot@users.noreply.github.com"
          git add dashboard/data.js dashboard/latest-flow.xlsx
          git commit -m "data: refresh domestic dashboard"
          git push
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p site-dist
          cp -R index.html .nojekyll dashboard global site-dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify failure
        if: failure()
        run: node automation/tools/notify_failure.mjs "국내 대시보드 자동 갱신"
