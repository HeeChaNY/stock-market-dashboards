name: Telegram cloud command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Telegram command"
        required: true
        type: choice
        options:
          - excel
          - compact
      chat_id:
        description: "Reply chat ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  run-command:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOT_COMMAND: ${{ inputs.command }}
      REQUEST_CHAT_ID: ${{ inputs.chat_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
      KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
      SCAN_REQUESTS_PER_SECOND: "8"
      SCAN_CONCURRENCY: "8"
      SCAN_RETRY_ROUNDS: "6"
      SCAN_RETRY_ROUND_DELAY_MS: "500"
      PYTHON_BIN: python

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate automation
        run: npm test
      - name: Execute Telegram command
        run: node automation/tools/run_telegram_command.mjs
      - name: Notify failure
        if: failure()
        run: node automation/tools/notify_failure.mjs "Telegram /${{ inputs.command }} 클라우드 명령"
